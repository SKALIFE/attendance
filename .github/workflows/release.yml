name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: macos-26
    environment: release
    steps:
      - uses: actions/checkout@v4
      - name: Validate SemVer tag
        run: |
          [[ "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*))?$ ]] || { echo "Invalid SemVer tag: ${GITHUB_REF_NAME}"; exit 1; }
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          IS_PRERELEASE=false
          if [[ "${GITHUB_REF_NAME}" == *"-"* ]]; then IS_PRERELEASE=true; fi
          echo "RELEASE_VERSION=${RELEASE_VERSION}" >> "$GITHUB_ENV"
          echo "RELEASE_BASENAME=SKALA-Attendance-${RELEASE_VERSION}-arm64" >> "$GITHUB_ENV"
          echo "IS_PRERELEASE=${IS_PRERELEASE}" >> "$GITHUB_ENV"
      - name: Validate required secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DEVELOPER_ID_APPLICATION_P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          DEVELOPER_ID_APPLICATION_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
          SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
          APPCAST_REPO_TOKEN: ${{ secrets.APPCAST_REPO_TOKEN }}
          UMAMI_BASE_URL: ${{ vars.UMAMI_BASE_URL }}
          UMAMI_WEBSITE_ID: ${{ vars.UMAMI_WEBSITE_ID }}
          UMAMI_HOSTNAME: ${{ vars.UMAMI_HOSTNAME }}
        run: |
          for name in APPLE_TEAM_ID DEVELOPER_ID_APPLICATION_P12_BASE64 DEVELOPER_ID_APPLICATION_P12_PASSWORD APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_PRIVATE_KEY_BASE64 SPARKLE_EDDSA_PRIVATE_KEY SPARKLE_PUBLIC_KEY APPCAST_REPO_TOKEN UMAMI_BASE_URL UMAMI_WEBSITE_ID UMAMI_HOSTNAME; do
            test -n "${!name}" || { printf '%s is required\n' "$name"; exit 1; }
          done
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build and test
        run: |
          scripts/test.sh
          scripts/build.sh Release
      - name: Import Developer ID certificate
        env:
          DEVELOPER_ID_APPLICATION_P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          DEVELOPER_ID_APPLICATION_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/skala-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$DEVELOPER_ID_APPLICATION_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$RUNNER_TEMP" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$RUNNER_TEMP" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$DEVELOPER_ID_APPLICATION_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k "$RUNNER_TEMP" "$KEYCHAIN_PATH"
      - name: Create signed release archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          UMAMI_BASE_URL: ${{ vars.UMAMI_BASE_URL }}
          UMAMI_WEBSITE_ID: ${{ vars.UMAMI_WEBSITE_ID }}
          UMAMI_HOSTNAME: ${{ vars.UMAMI_HOSTNAME }}
          SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
        run: |
          xcodegen generate
          xcodebuild archive \
            -project SKALAAttendance.xcodeproj \
            -scheme SKALAAttendance \
            -configuration Release \
            -archivePath build/SKALAAttendance.xcarchive \
            -destination 'generic/platform=macOS' \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            MARKETING_VERSION="$RELEASE_VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            UMAMI_BASE_URL="$UMAMI_BASE_URL" \
            UMAMI_WEBSITE_ID="$UMAMI_WEBSITE_ID" \
            UMAMI_HOSTNAME="${UMAMI_HOSTNAME:-attendance-app.skalife.kr}" \
            SPARKLE_PUBLIC_KEY="$SPARKLE_PUBLIC_KEY"
          mkdir -p release
          rm -rf release/SKALAAttendance.app
          cp -R build/SKALAAttendance.xcarchive/Products/Applications/SKALAAttendance.app release/SKALAAttendance.app
      - name: Notarize and staple app
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          ditto -c -k --keepParent release/SKALAAttendance.app release/notary-app.zip
          xcrun notarytool submit release/notary-app.zip \
            --key "$KEY_PATH" \
            --key-id "$APP_STORE_CONNECT_KEY_ID" \
            --issuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --wait
          xcrun stapler staple release/SKALAAttendance.app
          xcrun stapler validate release/SKALAAttendance.app
      - name: Create release ZIP and DMG
        run: |
          rm -f "release/${RELEASE_BASENAME}.zip" "release/${RELEASE_BASENAME}.dmg"
          ditto -c -k --keepParent release/SKALAAttendance.app "release/${RELEASE_BASENAME}.zip"
          APP_PATH="$PWD/release/SKALAAttendance.app" scripts/create-dmg.sh "$RELEASE_VERSION"
      - name: Notarize and staple DMG
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          xcrun notarytool submit "release/${RELEASE_BASENAME}.dmg" \
            --key "$KEY_PATH" \
            --key-id "$APP_STORE_CONNECT_KEY_ID" \
            --issuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --wait
          xcrun stapler staple "release/${RELEASE_BASENAME}.dmg"
          xcrun stapler validate "release/${RELEASE_BASENAME}.dmg"
      - name: Verify signed artifacts
        run: |
          codesign --verify --deep --strict release/SKALAAttendance.app
          spctl --assess --type execute -vvv release/SKALAAttendance.app
          spctl --assess --type open -vvv "release/${RELEASE_BASENAME}.dmg"
      - name: Generate Sparkle appcast
        if: env.IS_PRERELEASE != 'true'
        env:
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          SPARKLE_BIN="$PWD/build/SourcePackages/artifacts/sparkle/Sparkle/bin"
          APPCAST_DIR="$PWD/release/appcast"
          mkdir -p "$APPCAST_DIR"
          cp "release/${RELEASE_BASENAME}.zip" "$APPCAST_DIR/"
          cp CHANGELOG.md "$APPCAST_DIR/${RELEASE_BASENAME}.md"
          printf '%s' "$SPARKLE_EDDSA_PRIVATE_KEY" | "$SPARKLE_BIN/generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/skalife/attendance/releases/download/${GITHUB_REF_NAME}" \
            --embed-release-notes \
            -o "$APPCAST_DIR/appcast.xml" \
            "$APPCAST_DIR"
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: skala-attendance-release-candidate
          path: |
            release/SKALA-Attendance-*-arm64.zip
            release/SKALA-Attendance-*-arm64.dmg
            release/appcast/appcast.xml
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARGS=(--title "SKALA Attendance ${GITHUB_REF_NAME}" --notes-file CHANGELOG.md)
          if [ "${IS_PRERELEASE}" = "true" ]; then ARGS+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" \
            "release/${RELEASE_BASENAME}.zip" \
            "release/${RELEASE_BASENAME}.dmg" \
            "${ARGS[@]}"
      - name: Checkout public appcast repository
        if: env.IS_PRERELEASE != 'true'
        uses: actions/checkout@v4
        with:
          repository: SKALIFE/attendance-appcast
          token: ${{ secrets.APPCAST_REPO_TOKEN }}
          persist-credentials: false
          path: appcast-repo
      - name: Publish appcast to public repository
        if: env.IS_PRERELEASE != 'true'
        run: |
          cp release/appcast/appcast.xml appcast-repo/appcast.xml
          cp "release/appcast/${RELEASE_BASENAME}.md" "appcast-repo/${RELEASE_BASENAME}.md"
          cd appcast-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appcast.xml "${RELEASE_BASENAME}.md"
          if git diff --cached --quiet; then
            echo "No appcast changes to commit."
            exit 0
          fi
          git commit -m "chore: publish ${RELEASE_VERSION} appcast"
          git push origin HEAD:main
      - name: Record publication
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          Signed/notarized artifacts, GitHub Release assets, and the Sparkle appcast publication were prepared by the release environment-gated workflow. Production Sparkle update installation still requires manual validation from an older installed version.
          SUMMARY

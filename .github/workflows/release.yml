name: Release macOS app

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag and checkout
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) printf 'Release tag must use vX.Y.Z format.\n' >&2; exit 1 ;;
          esac
          test -n "$(git rev-parse --verify --quiet refs/remotes/origin/main)" || {
            printf 'Fetched origin/main is missing; refusing to validate release ancestry.\n' >&2
            exit 1
          }
          TAG_COMMIT=$(git rev-parse --verify --quiet "$GITHUB_REF^{commit}") || {
            printf 'Tagged commit is missing from the checkout.\n' >&2
            exit 1
          }
          git merge-base --is-ancestor "$TAG_COMMIT" "refs/remotes/origin/main"
          test -z "$(git status --porcelain)"
          git tag --points-at "$TAG_COMMIT" | grep -Fx -- "$TAG" >/dev/null
          VERSION=$(awk '/^[[:space:]]*MARKETING_VERSION:[[:space:]]*/ { sub(/^[^:]*:[[:space:]]*/, ""); gsub(/[[:space:]"]/, ""); print; exit }' project.yml)
          test "$TAG" = "v$VERSION"

      - name: Reject an existing GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          bash scripts/ensure-release-absent.sh "$TAG"

      - name: Run release metadata tests
        run: bash tests/release_metadata_test.sh

      - name: Install pinned XcodeGen
        run: |
          set -euo pipefail
          brew install mint
          mint install yonaskolb/XcodeGen@2.42.0
          printf '%s\n' "$HOME/.mint/bin" >>"$GITHUB_PATH"

      - name: Generate Xcode project and resolve Sparkle
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild -resolvePackageDependencies \
            -project SKALAAttendance.xcodeproj \
            -scheme SKALAAttendance \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/source-packages"

      - name: Import Developer ID certificate, build signed app, test, and package
        env:
          DEVELOPER_ID_APPLICATION_P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          DEVELOPER_ID_APPLICATION_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/skala-release.keychain-db"
          P12_PATH="$RUNNER_TEMP/skala-release.p12"
          ORIGINAL_KEYCHAIN=$(security default-keychain -d user | tr -d '"')
          KEYCHAIN_PASSWORD=$(uuidgen)
          cleanup() {
            security default-keychain -d user -s "$ORIGINAL_KEYCHAIN" >/dev/null 2>&1 || true
            rm -f "$P12_PATH"
            security delete-keychain "$KEYCHAIN_PATH" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          printf '%s' "$DEVELOPER_ID_APPLICATION_P12_BASE64" | base64 -D >"$P12_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$P12_PATH" -k "$KEYCHAIN_PATH" -P "$DEVELOPER_ID_APPLICATION_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)
          test -n "$IDENTITY"
          xcodebuild build \
            -project SKALAAttendance.xcodeproj \
            -scheme SKALAAttendance \
            -configuration Release \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/source-packages" \
            -destination 'platform=macOS,arch=arm64'
          xcodebuild test \
            -project SKALAAttendance.xcodeproj \
            -scheme SKALAAttendance \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/test-derived-data" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/source-packages" \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
          APP_PATH='build/Build/Products/Release/SKALA Attendance.app'
          bash tests/sparkle_2_9_4_integration_test.sh \
            --tools-root "$RUNNER_TEMP/source-packages/artifacts/sparkle/Sparkle" \
            --app "$APP_PATH"
          bash tests/package_release_test.sh
          VERSION="${GITHUB_REF_NAME#v}"
          bash scripts/package-release.sh \
            --app "$APP_PATH" \
            --version "$VERSION" \
            --identity "$IDENTITY"

      - name: Run notarization helper tests
        run: bash tests/notarize_test.sh

      - name: Notarize and staple app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          APP_PATH='build/Build/Products/Release/SKALA Attendance.app'
          bash scripts/notarize.sh --app "$APP_PATH"

      - name: Rebuild ZIP from stapled app
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          APP_PATH='build/Build/Products/Release/SKALA Attendance.app'
          ZIP_PATH="release/SKALA-Attendance-${VERSION}-arm64.zip"
          DMG_PATH="release/SKALA-Attendance-${VERSION}-arm64.dmg"
          rm -f "$ZIP_PATH" "$DMG_PATH"
          APP_PARENT=$(dirname "$APP_PATH")
          APP_NAME=$(basename "$APP_PATH")
          (
            cd "$APP_PARENT"
            /usr/bin/zip -qry "$GITHUB_WORKSPACE/$ZIP_PATH" "$APP_NAME"
          )
          /usr/bin/unzip -tqq "$ZIP_PATH"

      - name: Create and notarize DMG from stapled app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          APP_PATH='build/Build/Products/Release/SKALA Attendance.app'
          ZIP_PATH="release/SKALA-Attendance-${VERSION}-arm64.zip"
          DMG_PATH="release/SKALA-Attendance-${VERSION}-arm64.dmg"
          DMG_STAGING=$(mktemp -d "$RUNNER_TEMP/skala-final-dmg.XXXXXX")
          cleanup() {
            rm -rf "$DMG_STAGING"
          }
          trap cleanup EXIT
          cp -R "$APP_PATH" "$DMG_STAGING/"
          ln -s /Applications "$DMG_STAGING/Applications"
          hdiutil create \
            -volname 'SKALA Attendance' \
            -srcfolder "$DMG_STAGING" \
            -format UDZO \
            "$DMG_PATH"
          bash scripts/notarize.sh --dmg "$DMG_PATH" --zip "$ZIP_PATH"

      - name: Generate checksums for final release artifacts
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ZIP_PATH="release/SKALA-Attendance-${VERSION}-arm64.zip"
          DMG_PATH="release/SKALA-Attendance-${VERSION}-arm64.dmg"
          CHECKSUM_PATH="release/checksums.txt"
          test -s "$ZIP_PATH" && test -s "$DMG_PATH"
          shasum -a 256 "$ZIP_PATH" "$DMG_PATH" >"$CHECKSUM_PATH"
          test -s "$CHECKSUM_PATH"

      - name: Run appcast helper validation tests
        env:
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          bash tests/verify_local_release_candidate_test.sh
          bash tests/appcast_item_test.sh
          bash tests/verify_release_zip_test.sh
          bash tests/publish_appcast_test.sh

      - name: Generate an appcast candidate from release artifacts
        env:
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ZIP_PATH="release/SKALA-Attendance-${VERSION}-arm64.zip"
          APPCAST_BASELINE="$RUNNER_TEMP/appcast-baseline.xml"
          APPCAST_CANDIDATE="release/appcast-candidate.xml"
          SPARKLE_TOOLS_ROOT="$RUNNER_TEMP/source-packages/artifacts/sparkle/Sparkle"
          test -x "$SPARKLE_TOOLS_ROOT/bin/sign_update"
           SOURCE_APPCAST_SHA256=$(shasum -a 256 tests/fixtures/current-appcast.xml | awk '{print $1}')
           printf 'SOURCE_APPCAST_SHA256=%s\n' "$SOURCE_APPCAST_SHA256" >>"$GITHUB_ENV"
          cp tests/fixtures/current-appcast.xml "$APPCAST_BASELINE"
           ARCHIVE_SHA256=$(shasum -a 256 "$ZIP_PATH" | awk '{print $1}')
           printf 'APPCAST_ARCHIVE_SHA256=%s\n' "$ARCHIVE_SHA256" >>"$GITHUB_ENV"
          BUILD_NUMBER=$(awk '/^[[:space:]]*CURRENT_PROJECT_VERSION:[[:space:]]*/ { sub(/^[^:]*:[[:space:]]*/, ""); gsub(/[[:space:]"]/, ""); print; exit }' project.yml)
          bash scripts/generate-appcast-item.sh \
            --tag "$GITHUB_REF_NAME" \
            --build "$BUILD_NUMBER" \
            --archive "$ZIP_PATH" \
            --archive-sha256 "$ARCHIVE_SHA256" \
            --archive-url "https://github.com/SKALIFE/attendance/releases/download/${GITHUB_REF_NAME}/SKALA-Attendance-${VERSION}-arm64.zip" \
            --appcast "$APPCAST_BASELINE" \
            --project project.yml \
            --sparkle-tools-root "$SPARKLE_TOOLS_ROOT" \
            --release-probe scripts/verify-local-release-candidate.sh >"$APPCAST_CANDIDATE"
          xmllint --nonet --noout "$APPCAST_CANDIDATE"

      - name: Verify source appcast is unchanged
        run: |
          set -euo pipefail
          test "$SOURCE_APPCAST_SHA256" = "$(shasum -a 256 tests/fixtures/current-appcast.xml | awk '{print $1}')"

      - name: Create verified GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#v}"
          ZIP_PATH="release/SKALA-Attendance-${VERSION}-arm64.zip"
          DMG_PATH="release/SKALA-Attendance-${VERSION}-arm64.dmg"
            CHECKSUM_PATH="release/checksums.txt"
            RELEASE_NOTES_PATH="docs/releases/0.1.1.md"
            test -s "$ZIP_PATH" && test -s "$DMG_PATH" && test -s "$CHECKSUM_PATH" && test -s "$RELEASE_NOTES_PATH"
            gh release create "$TAG" "$ZIP_PATH" "$DMG_PATH" "$CHECKSUM_PATH" --verify-tag --title "SKALA Attendance $TAG" --notes-file "$RELEASE_NOTES_PATH"

      - name: Publish verified appcast after release creation
        env:
          APPCAST_REPO_TOKEN: ${{ secrets.APPCAST_REPO_TOKEN }}
        run: |
          set -euo pipefail
          set +x
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#v}"
          ARCHIVE_URL="https://github.com/SKALIFE/attendance/releases/download/${TAG}/SKALA-Attendance-${VERSION}-arm64.zip"
          bash scripts/publish-appcast.sh \
            --candidate release/appcast-candidate.xml \
            --archive-url "$ARCHIVE_URL" \
            --archive-sha256 "$APPCAST_ARCHIVE_SHA256" \
            --release-probe scripts/verify-release-zip.sh \
            --target-repo https://github.com/SKALIFE/attendance-appcast.git \
            --branch main \
            --appcast-path appcast.xml \
            --raw-appcast-url https://raw.githubusercontent.com/SKALIFE/attendance-appcast/main/appcast.xml
          unset APPCAST_REPO_TOKEN

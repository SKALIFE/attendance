name: SKALAAttendance
options:
  bundleIdPrefix: kr.skalife
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: "2.9.4"
settings:
  base:
    ARCHS: arm64
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "6.0"
    HARDENED_RUNTIME: YES
    COMBINE_HIDPI_IMAGES: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SKALAAttendance:
    type: application
    platform: macOS
    sources:
      - path: SKALAAttendance/Sources
    dependencies:
      - package: Sparkle
        product: Sparkle
    info:
      path: SKALAAttendance/Resources/Info.plist
      properties:
        CFBundleName: SKALA Attendance
        CFBundleDisplayName: SKALA Attendance
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        LSUIElement: true
        NSHumanReadableCopyright: "MIT License"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        CFBundleURLTypes:
          - CFBundleURLName: kr.skalife.attendance
            CFBundleURLSchemes:
              - skala
        SUFeedURL: https://raw.githubusercontent.com/skalife/attendance-appcast/main/appcast.xml
        SUPublicEDKey: PEHK0SeSaiSffuZaP8HxyTJX29sR8lNpM76ehfa8GKQ=
        UMAMI_BASE_URL: https://gateway.umami.is
        UMAMI_WEBSITE_ID: 2cb15230-9bd7-4488-bad8-e806d5f96619
        UMAMI_HOSTNAME: attendance-app.skalife.kr
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.skalife.attendance
        PRODUCT_NAME: SKALA Attendance
        DEVELOPMENT_TEAM: 9XY8538U7T
        CODE_SIGN_ENTITLEMENTS: SKALAAttendance/Resources/SKALAAttendance.entitlements
        CODE_SIGN_HARDENED_RUNTIME: YES
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application"
          CODE_SIGN_STYLE: Manual

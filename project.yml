name: SKALAAttendance
options:
  bundleIdPrefix: kr.skalife
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    ARCHS: arm64
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "6.0"
    HARDENED_RUNTIME: YES
    COMBINE_HIDPI_IMAGES: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SKALAAttendance:
    type: application
    platform: macOS
    sources:
      - path: SKALAAttendance/Sources
    info:
      path: SKALAAttendance/Resources/Info.plist
      properties:
        CFBundleName: SKALA Attendance
        CFBundleDisplayName: SKALA Attendance
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        LSUIElement: true
        NSHumanReadableCopyright: "MIT License"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        CFBundleURLTypes:
          - CFBundleURLName: kr.skalife.attendance
            CFBundleURLSchemes:
              - skala
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.skalife.attendance
        PRODUCT_NAME: SKALA Attendance
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
